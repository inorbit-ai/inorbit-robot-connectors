# DataSourceDefinitions for the canonical cleaning-vertical key-values published by the
# connector. Keys are snake_case and OEM-agnostic; percentages are published as 0-1, so
# percent datasources set `scale: 1` explicitly (omitting it with `unit: "%"` would
# default to 0.01 and re-scale an already-normalized value).
# Normalized enums have a `<key>_raw` twin carrying the untouched vendor value.
# Replace <ACCOUNT_ID> and <TAG_ID> with real values before applying.

# --- Battery -------------------------------------------------------------------
---
kind: DataSourceDefinition
apiVersion: v0.1
metadata:
  id: battery_pct
  scope: tag/<ACCOUNT_ID>/<TAG_ID>
spec:
  label: Battery
  unit: "%"
  scale: 1
  timeline:
    fieldType: number
  source:
    keyValue:
      key: battery_pct

---
kind: DataSourceDefinition
apiVersion: v0.1
metadata:
  id: charging
  scope: tag/<ACCOUNT_ID>/<TAG_ID>
