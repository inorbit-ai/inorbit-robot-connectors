# DataSourceDefinitions for the key-values published by the connector.
# The connector also splats the raw vendor status payload; only the curated
# keys below get a definition.
# Replace <ACCOUNT_ID> and <TAG_ID> with real values before applying.

# --- Battery -----------------------------------------------------------------
# Published as the raw vendor value, 0-100. No scale needed.
---
kind: DataSourceDefinition
apiVersion: v0.1
metadata:
  id: battery-percentage
  scope: tag/<ACCOUNT_ID>/<TAG_ID>
spec:
  label: Battery
  unit: "%"
  timeline:
    fieldType: number
  source:
    keyValue:
      key: battery_percentage

---
kind: DataSourceDefinition
apiVersion: v0.1
metadata:
  id: charging
  scope: tag/<ACCOUNT_ID>/<TAG_ID>
spec:
  label: Charging
  timeline:
    fieldType: boolean
  source:
    keyValue:
      key: charging

