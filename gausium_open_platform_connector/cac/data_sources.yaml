# --- Consumable wear ----------------------------------------------------------------
# consumable_<part>_wear_pct is generated for every device part reporting a life span,
# so the key set varies by robot model. These two cover the common scrubber parts; add
# more by copying the pattern (e.g. consumable_filter_wear_pct, consumable_rolling_brush_wear_pct).
# Wear is the consumed fraction (0-1), unlike the mission consumable_*_pct residuals.
---
kind: DataSourceDefinition
apiVersion: v0.1
metadata:
  id: consumable_scrubber_brush_wear_pct
  scope: tag/<ACCOUNT_ID>/<TAG_ID>
spec:
  label: Scrubber Brush Wear
  unit: "%"
  scale: 1
  timeline:
    fieldType: number
  source:
    keyValue:
      key: consumable_scrubber_brush_wear_pct

---
kind: DataSourceDefinition
apiVersion: v0.1
metadata:
  id: consumable_soft_squeegee_wear_pct
  scope: tag/<ACCOUNT_ID>/<TAG_ID>
spec:
