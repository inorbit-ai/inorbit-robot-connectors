# StatusDefinitions link to DataSourceDefinitions by matching `id`.
# After applying, enable "Display in Fleet Status" for each in Settings > Robot Data.
# Replace <ACCOUNT_ID> and <TAG_ID> with real values before applying.

# --- Battery (published as 0-100) ---------------------------------------------
---
kind: StatusDefinition
apiVersion: v0.1
metadata:
  id: battery-percentage
  scope: tag/<ACCOUNT_ID>/<TAG_ID>
spec:
  rules:
    - function: BELOW
      params:
        - 10
      status: ERROR
    - function: BELOW
      params:
        - 20
      status: WARNING

# --- API connectivity ----------------------------------------------------------
# False = the connector cannot reach the Gausium Open Platform API.
---
kind: StatusDefinition
apiVersion: v0.1
metadata:
  id: api-connected
  scope: tag/<ACCOUNT_ID>/<TAG_ID>
spec:
  rules:
    - function: EQUALS
      params:
        - false
      status: ERROR
