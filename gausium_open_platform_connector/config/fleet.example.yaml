# Gausium Open Platform Connector Configuration
# This file follows the inorbit-connector standard configuration format

# Timezone for the robot location (pytz timezone)
location_tz: America/Los_Angeles

# Logging configuration
# logging:
  # log_level: INFO

# Connector type identifier
connector_type: gausium_open_platform

# Update frequency in Hz for status polling and the execution loop
update_freq: 0.5

# Gausium Open Platform-specific configuration
# Credentials are account-scoped and shared across all robots in the fleet.
# Prefer storing credentials in the environment instead (see example.env).
connector_config:
  # (optional) URL of the Gausium Open Platform API. The default value is likely correct.
  # base_url: https://openapi.gs-robot.com/
  # API credentials (or INORBIT_GAUSIUM_OPEN_PLATFORM_CLIENT_ID etc. in the environment)
  client_id: your-client-id
  client_secret: your-client-secret
  access_key_secret: your-access-key-secret
  # (optional) A mission is reported successful if the cleaned area ratio reaches this value
  # mission_success_percentage_threshold: 0.9
  # (optional) Map resolution in meters per pixel, shared by pose conversion and map publishing
  # map_resolution: 0.05

# Fleet configuration - list of robots to manage
# Each robot must specify:
# - robot_id: InOrbit robot ID (string)
# - serial_number: Robot serial number in the Gausium Open Platform
fleet:
  - robot_id: gausium-robot-1
    serial_number: GS000-0000-000-0001

  - robot_id: gausium-robot-2
    serial_number: GS000-0000-000-0002

# Optional: Map configuration
# maps:
#   map_frame_id:
#     file: ./map.png
#     map_id: map1
#     map_label: Facility Map
#     origin_x: 0.0
#     origin_y: 0.0
#     resolution: 0.05

# Optional: User scripts directory
# user_scripts_dir: ./user_scripts

# Optional: Environment variables for user scripts
# env_vars:
#   MY_VAR: value
