[project]
name = "gausium-open-platform-connector"
version = "2.0.0"
description = "InOrbit Edge connector for robots managed by the Gausium Open Platform"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "InOrbit, Inc.", email = "support@inorbit.ai" },
]
maintainers = [
    { name = "InOrbit, Inc.", email = "support@inorbit.ai" },
]
keywords = ["inorbit", "connector", "edge-connector", "robotics", "robops", "gausium_open_platform"]
classifiers = [
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "inorbit-connector[system-stats]~=3.2.1",
    "httpx~=0.28",
    "tenacity~=9.0",
    "pillow~=12.1",
    "pydantic-settings~=2.13",
]

[project.urls]
Homepage = "https://github.com/inorbit-ai/inorbit-robot-connectors/tree/main/gausium_open_platform_connector"
Repository = "https://github.com/inorbit-ai/inorbit-robot-connectors"
Issues = "https://github.com/inorbit-ai/inorbit-robot-connectors/issues"

[project.optional-dependencies]
dev = [
    "coverage~=7.11",
    "pytest~=8.4",
    "pytest-asyncio~=1.2",
    "pytest-httpx~=0.35",
    "tox~=4.32",
    "tox-uv~=1.29",
    "colorlog~=6.10.1",
    "ruff~=0.16.0",
]

[project.scripts]
gausium-open-platform-connector = "gausium_open_platform_connector.gausium_open_platform_connector:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gausium_open_platform_connector"]

[tool.coverage.run]
source = ["gausium_open_platform_connector/"]

[tool.coverage.report]
fail_under = 0

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.tox]
env_list = ["py313"]

[tool.tox.gh]
python = { "3.13" = "py313" }

[tool.tox.env_run_base]
extras = ["dev"]
commands = [
    [
        "ruff",
        "check",
    ],
    [
        "coverage",
        "run",
        "-m",
        "pytest",
    ],
    [
        "coverage",
        "html",
        "-d",
        "{envlogdir}/coverage",
    ],
]
# The SDK and this project are not typed for pyright; CI checks are ruff + pytest
[tool.basedpyright]
typeCheckingMode = "off"
